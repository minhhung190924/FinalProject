{% include "teacher/_head.html" %}

<header>
  <a class="logout" href="/logout">Đăng xuất</a>
  <div class="menu-wrap">
    <button type="button" class="menu-toggle" onclick="toggleMainMenu(this)" aria-label="Mở menu điều hướng" aria-expanded="false" aria-haspopup="true"><span></span><span></span><span></span></button>
    <div class="menu-overlay" id="mainMenuOverlay" hidden>
      <nav class="menu-panel" aria-label="Menu điều hướng">
        <div class="menu-panel-header">
          <span class="menu-panel-title">Menu</span>
          <button type="button" class="menu-close" onclick="closeMainMenu()" aria-label="Đóng menu">&times;</button>
        </div>
        <a href="/">Dashboard</a>
        <a href="/audit">Nhật ký hoạt động</a>
      </nav>
    </div>
  </div>
  <h1 style="display:inline; font-size:16px; margin-left:8px;">{{ candidate.full_name }} (ID {{ candidate.id }})</h1>
</header>
<div class="container">
  <h2>Ảnh đăng ký</h2>
  <div class="gallery">
    {% for photo in photos %}
      <img src="/photo/{{ candidate.full_name }}/{{ loop.index0 }}">
    {% endfor %}
  </div>
</div>
